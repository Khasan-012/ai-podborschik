    for (const [from, to] of SYNONYMS) {
      q = q.split(from).join(to);
    }
    return q;

  // Расстояние Левенштейна — для прощения опечаток
  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (Math.abs(m - n) > 2) return 3;
    const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
    for (let j = 0; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++)
      for (let j = 1; j <= n; j++)
        d[i][j] = Math.min(
          d[i - 1][j] + 1,
          d[i][j - 1] + 1,
          d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
        );
    return d[m][n];
  }

  // Умный подбор: возвращает отсортированный список {tool, score}
  function rankTools(query) {
    const q = expandSynonyms(normalize(query));
    const tokens = q.split(/[^a-zа-я0-9]+/i).filter(w => w.length >= 4);

    const scored = TOOLS.map(tool => {
      let score = 0;
      const matched = new Set();

      for (const kw of tool.keywords) {
        const nkw = normalize(kw);
        // 1) прямое вхождение ключевого слова в запрос
        if (q.includes(nkw)) {
          score += nkw.length >= 6 ? 3 : 2;
          matched.add(kw);
          continue;
        }
        // 2) нечёткое совпадение по словам (прощаем 1–2 опечатки)
        if (nkw.includes(" ")) continue; // многословные — только по вхождению
        for (const tok of tokens) {
          const tol = tok.length >= 8 ? 2 : 1;
          if (tok.length >= 5 && nkw.length >= 4 &&
              levenshtein(tok, nkw) <= tol && !matched.has(kw)) {
            // длинное слово с 1-2 опечатками — сильный сигнал (перивести ≈ перевести)
            score += tok.length >= 8 ? 3 : 1;
            matched.add(kw);
            break;
          }
        }
      }
      return { tool, score };
    });

    scored.sort((a, b) => b.score - a.score);
    return scored;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function percentOf(score) {
    // Калибровка: 1 балл ≈ 60%, дальше растёт, потолок 98%
    return Math.min(98, Math.round(50 + score * 10));
  }

  function render(query) {
    const ranked = rankTools(query);
    const top = ranked[0];

    // Ничего не нашлось — универсальный вариант с пояснением
    if (top.score === 0) {
      result.innerHTML = `
        <div class="best">
          <span class="badge">🤖 Универсальный выбор для: «${escapeHtml(query)}»</span>
          <h2>${UNIVERSAL.name}</h2>
          <div class="tagline">${UNIVERSAL.tagline}</div>
          <p class="why">${UNIVERSAL.why}</p>
          <a class="open-btn" href="${UNIVERSAL.url}" target="_blank" rel="noopener">Открыть ${UNIVERSAL.name} ↗</a>
          <p class="fallback-note">Точное совпадение не найдено — попробуйте описать задачу другими словами, например «сделать сайт», «озвучить текст», «написать пост».</p>
        </div>`;
      return;
    }

    const bestPct = percentOf(top.score);
    const alts = ranked.filter(r => r.score > 0).slice(1, 3);

    const altCards = alts.map((r, i) => {
      const pct = Math.max(45, Math.round(bestPct * r.score / top.score));
      return `
        <div class="alt" style="animation-delay:${0.15 + i * 0.08}s">
          <div class="row">
            <div>
              <div class="name">${r.tool.name}</div>
              <div class="desc">${r.tool.tagline}</div>
            </div>
            <a href="${r.tool.url}" target="_blank" rel="noopener">Открыть ↗</a>
          </div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </div>`;
    }).join("");

    result.innerHTML = `
      <div class="best">
        <span class="badge">🏆 Лучший для: «${escapeHtml(query)}»</span>
        <div class="match"><div class="num">${bestPct}%</div><div class="lbl">совпадение</div></div>
        <h2>${top.tool.name}</h2>
        <div class="tagline">${top.tool.tagline}</div>
        <p class="why">${top.tool.why}</p>
        <a class="open-btn" href="${top.tool.url}" target="_blank" rel="noopener">Открыть ${top.tool.name} ↗</a>
      </div>
      ${alts.length ? `<div class="section-title">Хорошие альтернативы</div>${altCards}` : ""}
      <div class="hint">Не подходит? Опишите задачу подробнее — например «написать пост для Instagram» или «сделать сайт на Python».</div>
    `;
  }

  let debounceTimer = null;

  function run() {
    const query = input.value.trim();
    if (!query) { result.innerHTML = ""; return; }
    render(query);
  }

  // Живой поиск прямо во время ввода
  input.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(run, 250);
  });

  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { clearTimeout(debounceTimer); run(); }
  });

  goBtn.addEventListener("click", () => { clearTimeout(debounceTimer); run(); });

  document.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      input.value = chip.textContent.replace(/^\S+\s/, "");
      run();
    });
  });
</script>
</body>
</html>
